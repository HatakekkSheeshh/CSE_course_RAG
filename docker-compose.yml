services:
  backend:
    build:
      context: ./api
    image: cse_course_rag_backend:latest
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      - LLM_PROVIDER=${LLM_PROVIDER}
      - RAG_DATA_DIR=${RAG_DATA_DIR:-/workspace/data}
      - RAG_INDEX_DIR=${RAG_INDEX_DIR:-/workspace/data/indices}
    volumes:
      - .:/workspace:rw
    working_dir: /workspace
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    image: cse_course_rag_frontend:latest
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL}
      - CHOKIDAR_USEPOLLING=1
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
