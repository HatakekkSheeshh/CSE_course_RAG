services:
  ollama:
    image: ollama/ollama:latest
    container_name: cse_course_rag_ollama_1 
    profiles:
      - ollama  
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped
    mem_limit: 8g           
    cpus: 4.0               
    environment:
      - OLLAMA_NUM_GPU=1   
      - OLLAMA_MAX_LOADED_MODELS=1  
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./api
    image: cse_course_rag_backend:latest
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}  # Use service name 'ollama' in docker-compose network
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama2}
      - MODEL_USING=${MODEL_USING:-ollama}
      - LLM_PROVIDER=${LLM_PROVIDER:-${MODEL_USING:-ollama}}
      - RAG_DATA_DIR=${RAG_DATA_DIR:-/workspace/data}
      - RAG_INDEX_DIR=${RAG_INDEX_DIR:-/workspace/data/indices}
    volumes:
      - .:/workspace:rw
    working_dir: /workspace
    ports:
      - "8000:8000"
  frontend:
    build:
      context: ./frontend
    image: cse_course_rag_frontend:latest
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000/api}
      - CHOKIDAR_USEPOLLING=1
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  ollama_data:
